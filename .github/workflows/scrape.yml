name: Daily ESPN BPI Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants the bot permission to commit changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        run: python fetch_bpi.py

      - name: Commit and push if changes exist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bpi_rankings.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update BPI/SOR rankings CSV" && git push)
